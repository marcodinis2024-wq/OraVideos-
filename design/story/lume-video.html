/* frame hook: swap real footage frame by (virtual) time */
const POV0 = 126;
window.__beforeShot = async () => {
  const img = document.getElementById('pov'); if (!img || window.__povStart == null) return;
  const f = POV0 + Math.floor((performance.now() - window.__povStart) / 40); const src = `../../dist/pov/f_${String(Math.min(500, f)).padStart(4, '0')}.jpg`;
  if (!img.src.endsWith(src.slice(5))) { img.src = src; try { await img.decode(); } catch (e) { } }
};
window.__start = () => film();
