<body>
<svg width="0" height="0" style="position:absolute">
 <defs>
  <filter id="grade" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
   <feColorMatrix type="saturate" values=".85"/>
   <feComponentTransfer>
    <feFuncR type="table" tableValues=".035 .24 .515 .78 1"/>
    <feFuncG type="table" tableValues=".07 .265 .505 .745 .95"/>
    <feFuncB type="table" tableValues=".05 .215 .445 .66 .83"/>
   </feComponentTransfer>
  </filter>
  <filter id="vb" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur id="vbg" stdDeviation="0 0"/></filter>
  <linearGradient id="kkO" gradientUnits="userSpaceOnUse" x1="40.5" y1="0" x2="225.5" y2="0"><stop offset="0" stop-color="#BE9B47"/><stop offset=".24" stop-color="#CFAC58"/><stop offset=".68" stop-color="#F4D47D"/><stop offset="1" stop-color="#E9C877"/></linearGradient>
  <radialGradient id="sunGlow"><stop offset="0" stop-color="#F4D47D" stop-opacity=".6"/><stop offset=".4" stop-color="#D4AF37" stop-opacity=".2"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></radialGradient>
  <clipPath id="aboveLine"><rect x="-4000" y="-4000" width="8000" height="4101.6"/></clipPath>
 </defs>
</svg>
<div id="wrap"><div id="stage">
 <div id="cam" class="L">
  <section id="sHook" class="sc"><div class="bg bgF"></div><div class="key"></div></section>
  <section id="sBrand" class="sc"><div class="bg bgV"></div><div class="key"></div></section>
  <section id="sLoja" class="sc"><div class="bg bgF"></div><div class="key"></div></section>
  <section id="sTer" class="sc light"><div class="bg bgP"></div></section>
  <section id="sExp" class="sc"><div class="bg bgF"></div><div class="key"></div></section>
  <section id="sCta" class="sc"><div class="bg bgV"></div><div class="key"></div></section>
 </div>
 <canvas id="parts" class="L" width="1080" height="1920"></canvas>
 <div id="burst" class="L"></div>
 <div id="sweep" class="L" style="overflow:hidden"><div id="band"></div></div>
 <div id="bloomL" class="L" style="overflow:hidden"><div id="bloom"></div></div>

</div></div>
<script>
'use strict';
const CUT = /cut=15/.test(location.search) ? 15 : 30;
const FPS = 25, NF = CUT === 15 ? 384 : 768, DUR = NF / FPS; window.DUR = DUR;
const A = '../../../assets/', SEAL = '../v1/img/selo-k.png', LOGO = A + 'kokarte/logotipo-kokarte.svg';
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (f, a, b) => clamp((f - a) / (b - a));
const L = (a, b, t) => a + (b - a) * t;
function bez(x1, y1, x2, y2) {
  const X = t => ((1 - 3 * x2 + 3 * x1) * t + (3 * x2 - 6 * x1)) * t * t + 3 * x1 * t;
  const Y = t => ((1 - 3 * y2 + 3 * y1) * t + (3 * y2 - 6 * y1)) * t * t + 3 * y1 * t;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1, m = x; for (let i = 0; i < 28; i++) { m = (lo + hi) / 2; if (X(m) < x) lo = m; else hi = m; } return Y(m); };
}
const eOut = bez(.16, 1, .3, 1), eIn = bez(.7, 0, .84, 0), eIO = bez(.65, 0, .35, 1), eOutIn = bez(.55, 0, .75, .1);
function spring(ts, resp = .45, z = .86) { if (ts <= 0) return 0; const w = 2 * Math.PI / resp, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * ts) * (Math.cos(wd * ts) + z * w / wd * Math.sin(wd * ts)); }
const bell = (f, a, m, b) => f < m ? eOut(P(f, a, m)) : 1 - eIO(P(f, m, b));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(parent, tag, cls, html, css) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (css) e.style.cssText = css; parent.appendChild(e); return e; }
const vis = (e, v) => { e.style.visibility = v ? 'inherit' : 'hidden'; };
// "palavra *ouro* ~acento~ | linha 2"
const W = s => s.split('|').map(l => l.split(' ').map(w => { let m; if ((m = /^\*(.*)\*$/.exec(w))) return `<span class="w g">${m[1]}</span>`; if ((m = /^~(.*)~$/.exec(w))) return `<span class="w acc">${m[1]}</span>`; return `<span class="w">${w}</span>`; }).join(' ')).join('<br>');
function words(ws, f, t0, o = {}) {
  const st = o.st ?? 2, du = o.du ?? 10, dy = o.dy ?? 40, bl = o.bl ?? 10;
  ws.forEach((w, i) => { const q = eOut(P(f, t0 + i * st, t0 + i * st + du)); w.style.opacity = q; w.style.transform = `translateY(${(1 - q) * dy}px)`; w.style.filter = q < .999 ? `blur(${(1 - q) * bl}px)` : 'none'; });
}
// texto ancorado: y = centro
function T(parent, html, y, cls = '', css = '') {
  const o = mk(parent, 'div', 'o', null, `top:${y}px`);
  const i = mk(o, 'div', 'i ' + cls, html, css);
  return { o, i, ws: () => [...i.querySelectorAll('.w')] };
}
const tf = (el, dy = 0, sc = 1, extra = '') => { el.style.transform = `translateY(calc(-50% + ${dy}px)) scale(${sc}) ${extra}`; };
function fitFont(el, maxW, maxPx) { el.style.fontSize = '100px'; const w = el.offsetWidth; const px = Math.min(maxPx, 100 * maxW / w); el.style.fontSize = px.toFixed(1) + 'px'; return px; }

/* ---------- configuração por corte ---------- */
const C = CUT === 30 ? {
  R: { hook: [0, 48], brand: [36, 96], loja: [96, 348], ter: [336, 585], exp: [576, 684], cta: [672, 768] },
  bursts: [{ f0: 36, x: 545, y: 760, to: 'brand' }, { f0: 336, x: 540, y: 560, to: 'ter' }, { f0: 672, x: 543, y: 483, to: 'cta' }],
  loja: { chap: 96, t0: 120, step: 24, ed: 10, mos: 312 },
  ter: { chap: 336, st0: 356, s: [360, 396, 432, 468, 504], n: 5, fan: 540, pills: null, kin: 358 },
  cta: 672, slams: [0, 12, 24, 96, 340, 578],
} : {
  R: { hook: [0, 48], brand: [36, 96], loja: [96, 204], ter: [192, 300], exp: [9999, 9999], cta: [288, 384] },
  bursts: [{ f0: 36, x: 545, y: 760, to: 'brand' }, { f0: 192, x: 540, y: 700, to: 'ter' }, { f0: 288, x: 543, y: 483, to: 'cta' }],
  loja: { chap: null, t0: 96, step: 12, ed: 7, mos: null },
  ter: { chap: null, st0: 190, s: [196, 216, 240], n: 3, fan: null, pills: 264, kin: 196 },
  cta: 288, slams: [0, 12, 24],
};
const SC = { hook: $('#sHook'), brand: $('#sBrand'), loja: $('#sLoja'), ter: $('#sTer'), exp: $('#sExp'), cta: $('#sCta') };
const LINE = 760;

/* ---------- GANCHO ---------- */
const hline = mk(SC.hook, 'div', '', null, `top:${LINE - 2}px`); hline.id = 'hline';
const HW = ['RESPIRA.', 'RECARREGA.', 'BRILHA.'].map((s, k) => {
  const m = mk(SC.hook, 'div', 'wm'); const wi = mk(m, 'div', 'wi'); const sp = mk(wi, 'span', 'imp' + (k === 2 ? ' shine' : ''), s);
  const rm = mk(SC.hook, 'div', 'wm refl'); const ri = mk(rm, 'div', 'wi'); const rs = mk(ri, 'span', 'imp' + (k === 2 ? ' shine' : ''), s);
  return { m, wi, sp, rm, ri, rs };
