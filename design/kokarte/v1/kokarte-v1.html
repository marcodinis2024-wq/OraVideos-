<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOKARTE v1 — Uma destas mensagens é tua</title>
<link rel="stylesheet" href="../../../assets/fonts/kokarte/fonts.css">
<script src="sun-paths.js"></script>
<style>
:root{--verde:#334432;--ouro:#D4AF37;--ouroc:#F0D080;--flo:#0F2017;--musgo:#1D382B;--nev:#E8F1EC;--perg:#F4ECDC;--oa:#7F6118;--n3:#B3C2B2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#070d09;overflow:hidden}
#wrap{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--verde);font-family:Montserrat,sans-serif;color:var(--nev)}
.L{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.abs{position:absolute;left:0;top:0}
.w{display:inline-block;will-change:transform,opacity}
.g{color:var(--ouro)}
.kick{position:absolute;left:0;right:0;top:242px;text-align:center;text-shadow:0 2px 14px rgba(15,32,23,.55);font:600 30px/1.2 Montserrat,sans-serif;letter-spacing:.18em;color:var(--ouro);text-transform:uppercase}
.h1{position:absolute;left:70px;right:70px;text-align:center;font:700 112px/.98 Montserrat,sans-serif;letter-spacing:-.01em;color:var(--nev)}
.h2{position:absolute;left:70px;right:70px;text-align:center;font:700 84px/1 Montserrat,sans-serif;color:var(--nev)}
.orac{position:absolute;left:90px;right:90px;text-align:center;font:italic 500 76px/1.14 'Cormorant Garamond',serif;color:var(--nev)}
.vc{transform:translateY(-50%)}
/* fundo */
#bg{background:radial-gradient(ellipse 80% 55% at 50% 44%,#3b4e39 0%,#334432 60%,#2c3c2b 100%)}
#key{position:absolute;left:0;top:0;width:1500px;height:1500px;margin:-750px 0 0 -750px;border-radius:50%;background:radial-gradient(closest-side,rgba(240,208,128,.16),rgba(212,175,55,.06) 50%,rgba(212,175,55,0) 100%)}
#deep{background:radial-gradient(ellipse 90% 70% at 50% 55%,#16291d 0%,#0F2017 70%,#0a170f 100%)}
#vig{background:radial-gradient(ellipse 78% 62% at 50% 46%,rgba(15,32,23,0) 58%,rgba(15,32,23,.32) 100%)}
#grain{mix-blend-mode:overlay;opacity:.5}
/* fotos */
.ph{position:absolute;inset:-60px;overflow:hidden}
.ph img{position:absolute;width:100%;height:100%;object-fit:cover;filter:url(#duo)}
#pbg .ph img{filter:url(#duo) blur(14px) brightness(.8)}
#pbg:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,32,23,.45) 0%,rgba(15,32,23,.1) 35%,rgba(15,32,23,.15) 65%,rgba(15,32,23,.6) 100%)}
#p15 .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,32,23,.72) 0%,rgba(15,32,23,.45) 12%,rgba(15,32,23,0) 22%,rgba(15,32,23,0) 50%,rgba(15,32,23,.78) 78%,rgba(15,32,23,.85) 100%)}
#illus{position:absolute;left:90px;top:1542px;font:400 28px/1.3 Poppins,sans-serif;color:var(--n3);letter-spacing:.02em}
/* envelope */
.env{position:absolute;left:0;top:0;width:480px;height:300px;transform-origin:240px 150px}
.env svg,.hl svg{position:absolute;left:0;top:0;overflow:visible}
.csh{position:absolute;left:30px;top:282px;width:420px;height:46px;border-radius:50%;background:radial-gradient(closest-side,rgba(8,18,12,.55),rgba(8,18,12,0));filter:blur(6px)}
.seal{position:absolute;width:120px;height:120px;left:180px;top:118px}
.seal img,.sealh{position:absolute;left:0;top:0;width:120px;height:120px}
.glint{position:absolute;inset:0;-webkit-mask:url(img/selo-k.png) center/100% 100%;mask:url(img/selo-k.png) center/100% 100%;background:linear-gradient(115deg,rgba(255,250,230,0) 35%,rgba(255,250,230,.75) 50%,rgba(255,250,230,0) 65%);background-size:300% 100%;mix-blend-mode:screen}
.hl{position:absolute;left:0;top:0;width:480px;height:300px}
#flap{height:200px;transform-origin:240px 0}
.num{position:absolute;width:120px;margin-left:-60px;text-align:center;font:700 64px/1 Montserrat,sans-serif;color:var(--ouro)}
/* carta */
#lw{position:absolute;left:108px;top:350px;width:864px;height:1100px;transform-origin:432px 550px}
#flip{position:absolute;inset:0;transform-origin:432px 550px}
.face{position:absolute;left:0;top:0;width:864px;height:1100px}
.letter{border-radius:10px;background:radial-gradient(ellipse 80% 60% at 50% 38%,#FDF8EE 0%,#F6EFE0 50%,#EDE2CB 100%);box-shadow:0 50px 90px -40px rgba(4,10,6,.75),0 14px 28px -14px rgba(4,10,6,.45),inset 0 0 60px rgba(127,97,24,.10);overflow:hidden}
.letter .fr{position:absolute;left:0;top:0}
.lhead{position:absolute;left:0;right:0;top:118px;text-align:center;font:600 30px/1.2 'Cormorant Garamond',serif;letter-spacing:.24em;color:var(--oa);text-transform:uppercase}
.ldiv{position:absolute;left:282px;width:300px;top:178px;height:10px}
.ldiv i{position:absolute;top:4px;height:1px;width:130px;background:linear-gradient(90deg,rgba(127,97,24,0),rgba(127,97,24,.7))}
.ldiv i+b+i{transform:scaleX(-1)}
.ldiv i:first-child{left:0}.ldiv i:last-child{right:0}
.ldiv b{position:absolute;left:145px;top:0;width:9px;height:9px;background:var(--oa);transform:rotate(45deg)}
.lmsg{position:absolute;left:78px;right:78px;top:240px;height:600px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;font:italic 500 64px/1.16 'Cormorant Garamond',serif;color:var(--flo)}
.lseal{position:absolute;left:377px;top:880px;width:110px;height:110px;filter:drop-shadow(0 6px 8px rgba(80,55,10,.3))}
.spec{position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.22) 50%,rgba(255,255,255,0) 60%);background-size:300% 100%;mix-blend-mode:soft-light;pointer-events:none}
.card{position:absolute;left:0;width:864px;border-radius:32px;background:linear-gradient(165deg,rgba(43,76,58,.80) 0%,rgba(29,56,43,.76) 55%,rgba(22,44,33,.80) 100%);box-shadow:inset 0 0 0 1px rgba(232,241,236,.24),inset 0 1px 0 rgba(255,255,255,.22),0 50px 100px -36px rgba(3,9,5,.8)}
.card .spec{border-radius:32px;mix-blend-mode:screen;background:linear-gradient(105deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.10) 50%,rgba(255,255,255,0) 58%);background-size:300% 100%}
.cseal{position:absolute;left:384px;top:-48px;width:96px;height:96px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35)) drop-shadow(0 0 16px rgba(240,208,128,.35))}
.cc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:20px;text-align:center}
.cname{font:700 84px/1.02 Montserrat,sans-serif;color:var(--nev);letter-spacing:-.01em}
.cdur{margin-top:36px;font:400 40px/1 Poppins,sans-serif;color:var(--n3)}
.cline{margin:44px 0 40px;width:140px;height:2px;background:linear-gradient(90deg,rgba(212,175,55,0),#D4AF37,rgba(212,175,55,0))}
.cprice{font:600 72px/1 Poppins,sans-serif;color:var(--ouro);font-variant-numeric:tabular-nums;letter-spacing:.005em}
#lsh{position:absolute;left:0;top:0;width:800px;height:70px;margin:-35px 0 0 -400px;border-radius:50%;background:radial-gradient(closest-side,rgba(5,12,8,.6),rgba(5,12,8,0));filter:blur(10px)}
#bloom1,#bloom2{position:absolute;left:0;top:0;border-radius:50%;mix-blend-mode:screen;background:radial-gradient(closest-side,rgba(255,236,170,.95),rgba(240,208,128,.45) 35%,rgba(212,175,55,0) 100%)}
.gline{position:absolute;height:3px;background:linear-gradient(90deg,rgba(212,175,55,0),#D4AF37 18%,#F4D47D 50%,#D4AF37 82%,rgba(212,175,55,0));box-shadow:0 0 14px rgba(240,208,128,.45)}
/* trio */
.mini{position:absolute;left:0;top:0;width:864px;height:1100px;transform-origin:0 0}
.tn{position:absolute;width:120px;margin-left:-60px;text-align:center;font:700 64px/1 Montserrat,sans-serif;color:var(--ouro)}
/* marca / cta */
#brand,#cta{overflow:hidden}
.bbg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 55% at 50% 44%,#3b4e39 0%,#334432 60%,#2c3c2b 100%)}
.logo{position:absolute;left:0;top:0}
.sub{position:absolute;left:70px;right:70px;text-align:center;font:600 48px/1.2 Montserrat,sans-serif;color:var(--nev)}
.tel{position:absolute;left:0;right:0;text-align:center;font:600 72px/1 Poppins,sans-serif;color:var(--ouro);font-variant-numeric:tabular-nums}
.hand{position:absolute;left:0;right:0;text-align:center;font:400 40px/1.2 Poppins,sans-serif;color:var(--nev);letter-spacing:.01em}
#ctaMask{position:absolute;left:0;top:0;width:1080px;height:1098px;overflow:hidden}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
 <defs>
  <filter id="duo" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
   <feColorMatrix type="matrix" values=".30 .59 .11 0 0  .30 .59 .11 0 0  .30 .59 .11 0 0  0 0 0 1 0"/>
   <feComponentTransfer>
    <feFuncR type="table" tableValues=".03 .07 .15 .27 .55 .90"/>
    <feFuncG type="table" tableValues=".06 .13 .23 .33 .52 .80"/>
    <feFuncB type="table" tableValues=".045 .095 .16 .20 .22 .46"/>
   </feComponentTransfer>
  </filter>
  <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9C9A8"/><stop offset="1" stop-color="#E8DCC2"/></linearGradient>
  <linearGradient id="gF" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F2E5"/><stop offset=".55" stop-color="#F1E8D5"/><stop offset="1" stop-color="#E5D8BE"/></linearGradient>
  <linearGradient id="gL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCF8EF"/><stop offset="1" stop-color="#EEE4CF"/></linearGradient>
  <linearGradient id="gI" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2D3B5"/><stop offset="1" stop-color="#D3C19C"/></linearGradient>
  <linearGradient id="kkO" gradientUnits="userSpaceOnUse" x1="40.5" y1="0" x2="225.5" y2="0"><stop offset="0" stop-color="#BE9B47"/><stop offset=".24" stop-color="#CFAC58"/><stop offset=".68" stop-color="#F4D47D"/><stop offset="1" stop-color="#E9C877"/></linearGradient>
  <radialGradient id="sunGlow"><stop offset="0" stop-color="#F4D47D" stop-opacity=".55"/><stop offset=".4" stop-color="#D4AF37" stop-opacity=".18"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></radialGradient>
  <clipPath id="aboveLine"><rect x="-2000" y="-2000" width="5000" height="2101.4"/></clipPath>
 </defs>
</svg>
<div id="wrap"><div id="stage">
 <div id="bg" class="L"></div>
 <div class="L" style="overflow:hidden"><div id="key"></div></div>
 <div id="deep" class="L"></div>
 <div id="pbg" class="L"></div>
 <canvas id="parts" class="L" width="1080" height="1920"></canvas>
 <div id="fan" class="L"></div>
 <div id="hero" class="L"></div>
 <div id="trio" class="L"></div>
 <div id="m4" class="L"></div>
 <div id="brand" class="L"></div>
 <div id="p15" class="L"></div>
 <div id="cta" class="L"></div>
 <canvas id="fx" class="L" width="1080" height="1920"></canvas>
 <div id="vig" class="L"></div>
 <div id="txt" class="L"></div>
 <div id="illus">Imagens ilustrativas</div>
 <canvas id="grain" class="L" width="540" height="960" style="width:1080px;height:1920px"></canvas>
</div></div>
<script>
'use strict';
const FPS = 25, DUR = 34.72; window.DUR = DUR;
const A = '../../../assets/', SEAL = 'img/selo-k.png', LOGO = A + 'kokarte/logotipo-kokarte.svg';
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (f, a, b) => clamp((f - a) / (b - a));
const L = (a, b, t) => a + (b - a) * t;
function bez(x1, y1, x2, y2) {
  const X = t => ((1 - 3 * x2 + 3 * x1) * t + (3 * x2 - 6 * x1)) * t * t + 3 * x1 * t;
  const Y = t => ((1 - 3 * y2 + 3 * y1) * t + (3 * y2 - 6 * y1)) * t * t + 3 * y1 * t;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1, m = x; for (let i = 0; i < 28; i++) { m = (lo + hi) / 2; if (X(m) < x) lo = m; else hi = m; } return Y(m); };
}
const eOut = bez(.16, 1, .3, 1), eIn = bez(.7, 0, .84, 0), eIO = bez(.65, 0, .35, 1);
function spring(ts, resp = .45, z = .86) { if (ts <= 0) return 0; const w = 2 * Math.PI / resp, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * ts) * (Math.cos(wd * ts) + z * w / wd * Math.sin(wd * ts)); }
const bell = (f, a, m, b) => f < m ? eOut(P(f, a, m)) : 1 - eIO(P(f, m, b));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(parent, tag, cls, html, css) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (css) e.style.cssText = css; parent.appendChild(e); return e; }
const vis = (e, v) => { e.style.visibility = v ? 'inherit' : 'hidden'; };
// "palavra palavra|linha 2 *ouro*"
const W = s => s.split('|').map(l => l.split(' ').map(w => { const g = /^\*(.*)\*$/.exec(w); return `<span class="w${g ? ' g' : ''}">${g ? g[1] : w}</span>`; }).join(' ')).join('<br>');
function animWords(ws, f, t0, o = {}) {
  const st = o.st ?? 2, du = o.du ?? 13, dy = o.dy ?? 40, bl = o.bl ?? 10;
  ws.forEach((w, i) => { const q = eOut(P(f, t0 + i * st, t0 + i * st + du)); w.style.opacity = q; w.style.transform = `translateY(${(1 - q) * dy}px)`; w.style.filter = q < .999 ? `blur(${(1 - q) * bl}px)` : 'none'; });
}

/* ---------- envelope ---------- */
const SVG_BACK = `<svg width="480" height="300" viewBox="0 0 480 300"><rect width="480" height="300" rx="12" fill="url(#gB)"/><path d="M4 10 L240 176 L476 10" fill="none" stroke="rgba(110,80,30,.14)" stroke-width="3"/></svg>`;
const SVG_FRONT = `<svg width="480" height="300" viewBox="0 0 480 300">
 <path d="M0 16 Q0 4 11 9 L240 172 L469 9 Q480 4 480 16 L480 288 Q480 300 468 300 L12 300 Q0 300 0 288 Z" fill="url(#gF)"/>
 <path d="M0 16 L240 172 L0 300 Z" fill="rgba(90,65,20,.035)"/><path d="M480 16 L240 172 L480 300 Z" fill="rgba(255,255,255,.18)"/>
 <path d="M5 296 L214 182 M475 296 L266 182" stroke="rgba(120,90,40,.2)" stroke-width="1.6" fill="none"/>
 <path d="M6 298.5 L215 184.5 M474 298.5 L265 184.5" stroke="rgba(255,255,255,.55)" stroke-width="1" fill="none"/>
 <path d="M2 11 L240 174 L478 11" stroke="rgba(255,255,255,.75)" stroke-width="1.4" fill="none"/>
 <g transform="translate(240 262)" fill="none" stroke="#B8923A" stroke-width="1.6" opacity=".75" stroke-linecap="round"><path d="M-6 0 C-30 -2 -52 -10 -70 -24 M-20 -1 q-6 -10 -2 -18 M-36 -5 q-8 -9 -4 -18 M-52 -12 q-9 -7 -6 -16 M6 0 C30 -2 52 -10 70 -24 M20 -1 q6 -10 2 -18 M36 -5 q8 -9 4 -18 M52 -12 q9 -7 6 -16"/></g>
 <rect x=".5" y=".5" width="479" height="299" rx="12" fill="none" stroke="rgba(255,255,255,.35)"/></svg>`;
const FLAP_PATH = 'M0 12 Q0 0 12 0 L468 0 Q480 0 480 12 L262 172 Q240 188 218 172 Z';
const SVG_FLAP = `<svg width="480" height="200" viewBox="0 0 480 200" style="filter:drop-shadow(0 7px 7px rgba(70,50,15,.22))"><path d="${FLAP_PATH}" fill="url(#gL)" stroke="rgba(130,100,50,.18)" stroke-width="1.2"/><path d="M8 3 L240 174 L472 3" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1"/></svg>`;
const SVG_FLAPIN = `<svg width="480" height="200" viewBox="0 0 480 200"><path d="${FLAP_PATH}" fill="url(#gI)" stroke="rgba(130,100,50,.2)" stroke-width="1.2"/></svg>`;
function envelope(parent) {
  const e = mk(parent, 'div', 'env');
  mk(e, 'div', 'csh'); e.insertAdjacentHTML('beforeend', SVG_BACK + SVG_FRONT);
  mk(e, 'div', 'hl', SVG_FLAP);
  const s = mk(e, 'div', 'seal', `<img src="${SEAL}"><div class="glint"></div>`);
  return { e, s, img: s.querySelector('img'), gl: s.querySelector('.glint') };
}

/* ---------- conteúdos ---------- */
const MSG = [
  { b: ['Não confundas uma lição', 'com um lugar onde tens de permanecer.'], t: [14, 42] },
  { b: ['Hoje faz uma pausa', 'e pergunta-te:', '‘O que é que eu preciso?’'], t: [14, 28, 42] },
  { b: ['Nem tudo o que', 'te tira a paz', 'merece uma resposta.'], t: [14, 28, 42] },
];
const SRV = [
  { n: 'Mapeamento|Energético', p: '45.000 Kz', img: A + 'stock/unsplash/kokarte/pendulo-cristal.jpg', pos: '42% 62%' },
  { n: 'Massagem|Bioenergética|com Cristais', p: '38.000 Kz', img: A + 'stock/unsplash/kokarte/pedras-massagem.jpg', pos: '50% 50%' },
  { n: 'Reiki|Tibetano', p: '59.000 Kz', img: A + 'stock/unsplash/velas-fundo-preto.jpg', pos: '60% 50%' },
];
const FRAME_SVG = `<svg class="fr" width="864" height="1100" viewBox="0 0 864 1100" fill="none" stroke="#7F6118">
 <rect x="30" y="30" width="804" height="1040" rx="4" stroke-width="2" opacity=".62"/>
 <rect x="42" y="42" width="780" height="1016" rx="2" stroke-width="1" opacity=".38"/>
 ${[[42, 42, 1, 1], [822, 42, -1, 1], [42, 1058, 1, -1], [822, 1058, -1, -1]].map(([x, y, sx, sy]) => `<path transform="translate(${x} ${y}) scale(${sx} ${sy})" d="M10 34 Q10 10 34 10 M18 34 Q18 18 34 18 M34 10 L60 10" stroke-width="1.4" opacity=".7"/><path transform="translate(${x} ${y}) scale(${sx} ${sy})" d="M22 22 l4 -4 l4 4 l-4 4 z" fill="#7F6118" stroke="none" opacity=".7"/>`).join('')}
</svg>`;
const letterFront = (mi, anim) => `${FRAME_SVG}<div class="lhead">Uma mensagem para ti</div><div class="ldiv"><i></i><b></b><i></i></div>
 ${(mi == null ? [0, 1, 2] : [mi]).map(m => `<div class="lmsg" data-m="${m}">${MSG[m].b.map(b => `<div class="blk">${anim ? W(b) : b}</div>`).join('')}</div>`).join('')}
 <img class="lseal" src="${SEAL}"><div class="spec"></div>`;

/* ---------- construção ---------- */
const fanE = [{ x: 230, y: 790, r: -8 }, { x: 540, y: 760, r: 0 }, { x: 850, y: 790, r: 8 }].map(p => Object.assign(envelope($('#fan')), p));
const fanN = [0, 1, 2].map(i => mk($('#fan'), 'div', 'num', String(i + 1)));
// herói: camadas separadas para intercalar a carta
const H = {};
H.back = mk($('#hero'), 'div', 'hl', SVG_BACK, 'z-index:1');
H.flap = mk($('#hero'), 'div', 'hl', SVG_FLAP + SVG_FLAPIN); H.flap.id = 'flap';
H.flapF = H.flap.children[0]; H.flapI = H.flap.children[1];
H.lsh = mk($('#hero'), 'div', '', '', 'z-index:3'); H.lsh.id = 'lsh';
H.lw = mk($('#hero'), 'div', '', '', 'z-index:4'); H.lw.id = 'lw';
H.flip = mk(H.lw, 'div'); H.flip.id = 'flip';
H.front = mk(H.flip, 'div', 'face letter', letterFront(null, true));
H.back2 = mk(H.flip, 'div', 'face');
H.card = mk(H.back2, 'div', 'card', `<img class="cseal" src="${SEAL}">` + SRV.map((s, i) => `<div class="cc" data-s="${i}"><div class="cname">${W(s.n)}</div><div class="cdur">${W('60 min')}</div><div class="cline"></div><div class="cprice">${s.p}</div></div>`).join('') + '<div class="spec"></div>');
H.front2 = mk($('#hero'), 'div', 'hl', SVG_FRONT, 'z-index:5');
H.seal = mk($('#hero'), 'div', 'hl', `<img class="sealh" src="${SEAL}" style="left:180px;top:118px;clip-path:inset(0 50% 0 0)"><img class="sealh" src="${SEAL}" style="left:180px;top:118px;clip-path:inset(0 0 0 50%)">`, 'z-index:6');
H.sealL = H.seal.children[0]; H.sealR = H.seal.children[1];
H.bloom = mk($('#hero'), 'div', '', '', 'z-index:7;width:1100px;height:1100px'); H.bloom.id = 'bloom1';
H.sweep = mk($('#hero'), 'div', 'gline', '', 'z-index:8;top:1440px;left:0');
